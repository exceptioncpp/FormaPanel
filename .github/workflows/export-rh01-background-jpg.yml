name: Export RH-01 background JPEG (480x480)
on:
  push:
    paths:
      - '.github/workflows/export-rh01-background-jpg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert exact approved background PNG to JPEG
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('assets/generated/480x480/rh01-background.png')
          dst = src.with_suffix('.jpg')
          with Image.open(src) as img:
              assert img.size == (480, 480), img.size
              img.convert('RGB').save(dst, 'JPEG', quality=95, subsampling=0, optimize=True)
          with Image.open(dst) as img:
              assert img.size == (480, 480) and img.format == 'JPEG'
          print(f'{dst}: {dst.stat().st_size} bytes')
          PY
      - name: Commit reproducible JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/480x480/rh01-background.jpg
          if git diff --cached --quiet; then
            echo "JPEG unchanged"
          else
            git commit -m "assets(rh01): export exact 480x480 background JPEG"
            git push
          fi
