lvgl:
  pages:
  - id: ui_system
    bg_color: 1054746
    bg_opa: COVER
    text_color: 16776949
    text_font: ui_font_body
    pad_all: 0
    scrollable: false
    widgets:
    - image:
        id: system_background
        x: 0
        y: 0
        width: 480
        height: 480
        src: rh01_background
        clickable: false
    - obj:
        id: system_dim
        x: 0
        y: 0
        width: 480
        height: 480
        bg_opa: 50%
        border_width: 0
        pad_all: 0
        scrollable: false
        radius: 0
        bg_color: 1054746
        clickable: false
    - image:
        id: system_intro_icon
        x: 32
        y: 113
        width: 40
        height: 40
        src: ui_icon_home_40
        clickable: false
    - label:
        id: system_room
        x: 90
        y: 113
        width: 358
        height: 32
        text: Панель ${room_label}
        text_font: ui_font_body
        text_color: 16776949
    - label:
        id: system_connection
        x: 90
        y: 153
        width: 358
        height: 44
        text: Ожидание Home Assistant
        text_font: ui_font_caption
        text_color: 12701642
    - label:
        id: system_brightness_label
        x: 32
        y: 217
        width: 300
        height: 24
        text: Яркость экрана
        text_font: ui_font_caption
        text_color: 16776949
    - label:
        id: system_brightness_value
        x: 360
        y: 217
        width: 88
        height: 24
        text: --%
        text_font: ui_font_caption
        text_color: 16776949
        text_align: RIGHT
    - slider:
        id: system_brightness
        x: 32
        y: 261
        width: 416
        height: 6
        min_value: 10
        max_value: 100
        value: 60
        bg_color: 16776949
        bg_opa: 17%
        radius: 6
        indicator:
          bg_color: 15781005
          radius: 6
        knob:
          bg_color: 16773578
          pad_all: 7
          radius: 20
          shadow_color: 15781005
          shadow_width: 14
          shadow_opa: 30%
    - label:
        id: system_weather_caption
        x: 32
        y: 309
        width: 210
        height: 24
        text: Источник погоды
        text_font: ui_font_caption
        text_color: 12701642
    - label:
        id: system_weather_source
        x: 245
        y: 309
        width: 203
        height: 24
        text: Home Assistant
        text_font: ui_font_caption
        text_color: 16776949
        text_align: RIGHT
    - obj:
        id: system_info_rule
        x: 32
        y: 342
        width: 416
        height: 1
        bg_opa: 12%
        border_width: 0
        pad_all: 0
        scrollable: false
        radius: 0
        bg_color: 16776949
    - label:
        id: system_version_caption
        x: 32
        y: 357
        width: 200
        height: 24
        text: Версия интерфейса
        text_font: ui_font_caption
        text_color: 12701642
    - label:
        id: system_version
        x: 236
        y: 357
        width: 212
        height: 40
        text: FormaPanel 0.2
        text_font: ui_font_small
        text_color: 16776949
        text_align: RIGHT
    - label:
        id: system_title
        x: 30
        y: 24
        width: 390
        height: 36
        text: Настройки
        text_font: ui_font_title
        text_color: 16776949
    - label:
        id: system_room_caption
        x: 30
        y: 65
        width: 330
        height: 22
        text: ${room_label}
        text_font: ui_font_caption
        text_color: 12701642
    - obj:
        id: system_nav_rule
        x: 28
        y: 418
        width: 424
        height: 1
        bg_opa: 15%
        border_width: 0
        pad_all: 0
        scrollable: false
        radius: 0
        bg_color: 16776949
        clickable: false
    - button:
        id: system_back
        x: 28
        y: 424
        width: 125
        height: 50
        bg_opa: TRANSP
        border_width: 0
        border_color: 16776949
        border_opa: 30%
        outline_width: 0
        pad_all: 0
        shadow_width: 0
        radius: 0
        text_font: ui_font_caption
        text_color: 16776949
        pressed:
          bg_opa: TRANSP
          shadow_width: 0
        widgets:
        - image:
            id: system_back_image
            x: 0
            y: 14
            width: 21
            height: 21
            src: ui_icon_back_21
            clickable: false
        - label:
            id: system_back_text
            x: 30
            y: 15
            width: 90
            height: 24
            text: Назад
            text_font: ui_font_caption
            text_color: 16776949
    - label:
        id: system_nav_room
        x: 164
        y: 442
        width: 150
        height: 20
        text: ${room_label}
        text_font: ui_font_small
        text_color: 11321016
        text_align: CENTER
    - button:
        id: system_home
        x: 327
        y: 424
        width: 125
        height: 50
        bg_opa: TRANSP
        border_width: 0
        border_color: 16776949
        border_opa: 30%
        outline_width: 0
        pad_all: 0
        shadow_width: 0
        radius: 0
        text_font: ui_font_caption
        text_color: 16776949
        pressed:
          bg_opa: TRANSP
          shadow_width: 0
        widgets:
        - label:
            id: system_home_text
            x: 4
            y: 15
            width: 90
            height: 24
            text: Домой
            text_font: ui_font_caption
            text_color: 16776949
        - image:
            id: system_home_image
            x: 102
            y: 14
            width: 21
            height: 21
            src: ui_icon_home_21
            clickable: false
    - button:
        id: system_settings
        x: 408
        y: 24
        width: 44
        height: 44
        hidden: true
