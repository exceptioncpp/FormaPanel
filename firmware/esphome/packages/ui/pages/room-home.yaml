lvgl:
  pages:
    - id: rh01_home
      bg_opa: COVER
      pad_all: 0
      scrollable: false
      widgets:
        - image:
            id: rh01_background_image
            src: rh01_background
            x: 0
            y: 0
            width: 480
            height: 480
            clickable: false
        - image:
            id: rh01_weather_icon
            src: rh01_weather
            x: 30
            y: 27
            width: 64
            height: 54
        - label:
            id: rh01_outdoor_temperature
            text: ${demo_outdoor_temperature}
            text_font: rh01_font_weather
            x: 96
            y: 34
            width: 62
            height: 42
        - image:
            id: rh01_wind_icon
            src: rh01_wind
            x: 160
            y: 43
            width: 28
            height: 26
        - label:
            id: rh01_wind_value
            text: ${demo_wind}
            text_font: rh01_font_weather
            x: 197
            y: 34
            width: 43
            height: 42
        - label:
            id: rh01_clock
            text: ${demo_time}
            text_font: rh01_font_clock
            x: 29
            y: 82
            width: 250
            height: 96
        - label:
            id: rh01_room_temperature
            text: ${demo_room_temperature}
            text_font: rh01_font_temperature
            x: 29
            y: 365
            width: 110
            height: 84
        - obj:
            id: rh01_climate_separator
            x: 138
            y: 386
            width: 1
            height: 47
            bg_color: 0xFFFEF5
            bg_opa: 55%
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
        - label:
            id: rh01_room_humidity
            text: ${demo_room_humidity}
            x: 155
            y: 381
            width: 90
            height: 30
        - label:
            id: rh01_room_co2
            text: ${demo_room_co2}
            x: 155
            y: 406
            width: 112
            height: 30
        - button:
            id: rh01_lamp_button
            x: 366
            y: 332
            width: 112
            height: 128
            pad_all: 0
            border_width: 0
            outline_width: 0
            radius: 0
            bg_opa: TRANSP
            shadow_width: 0
            checkable: false
            pressed:
              bg_opa: TRANSP
              shadow_width: 0
            checked:
              bg_opa: TRANSP
              shadow_width: 0
            widgets:
              - image:
                  id: rh01_lamp_image
                  src: rh01_lamp_on
                  x: 8
                  y: 4
                  width: 96
                  height: 112
                  clickable: false
        - button:
            id: home_weather_hit
            x: 20
            y: 20
            width: 230
            height: 58
            pad_all: 0
            border_width: 0
            outline_width: 0
            radius: 0
            bg_opa: TRANSP
            shadow_width: 0
            pressed:
              bg_opa: TRANSP
              shadow_width: 0
        - button:
            id: home_climate_hit
            x: 20
            y: 355
            width: 255
            height: 100
            pad_all: 0
            border_width: 0
            outline_width: 0
            radius: 0
            bg_opa: TRANSP
            shadow_width: 0
            pressed:
              bg_opa: TRANSP
              shadow_width: 0
