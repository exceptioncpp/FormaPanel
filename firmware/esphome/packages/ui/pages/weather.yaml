            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: 0x10181A
            bg_opa: 50%
            border_width: 0
            radius: 0
            pad_all: 0
            clickable: false
        - label:
            id: weather_title
            text: "Погода"
            x: 30
            y: 24
            width: 220
            height: 36
            text_font: ui_font_title
            text_color: 0xFFFEF5
