# Ambient weather layout matching visual-review-01. No live defaults.
lvgl:
  pages:
    - id: ui_weather
      bg_color: 0x10181A
      bg_opa: COVER
      text_color: 0xFFFEF5
      text_font: ui_font_body
      pad_all: 0
      scrollable: false
