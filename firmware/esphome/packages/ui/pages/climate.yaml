lvgl:
  pages:
  - id: ui_climate
    bg_color: 1054746
    bg_opa: COVER
    text_color: 16776949
    text_font: ui_font_body
    pad_all: 0
    scrollable: false
    widgets:
    - image:
        id: climate_background
        x: 0
        y: 0
        width: 480
        height: 480
        src: rh01_background
        clickable: false
    - obj:
        id: climate_dim
        x: 0
        y: 0
        width: 480
        height: 480
        bg_opa: 50%
        border_width: 0
        pad_all: 0
        scrollable: false
        radius: 0
        bg_color: 1054746
        clickable: false
    - obj:
        id: climate_auto_group
        x: 0
        y: 0
        width: 480
        height: 418
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        scrollable: false
        radius: 0
        widgets:
        - label:
            id: climate_target_caption
            x: 32
            y: 150
            width: 280
            height: 23
            text: Целевая температура
            text_font: ui_font_caption
            text_color: 12701642
        - label:
            id: climate_target
            x: 29
            y: 172
            width: 290
            height: 92
            text: --°
            text_font: ui_font_value
            text_color: 16776949
        - label:
            id: climate_temperature
            x: 32
            y: 269
            width: 285
            height: 30
            text: В комнате --°
            text_font: ui_font_body
            text_color: 16776949
        - label:
            id: climate_status
            x: 33
            y: 302
            width: 275
            height: 26
            text: Ожидание HA
            text_font: ui_font_caption
            text_color: 15781005
        - button:
            id: climate_minus
            x: 25
            y: 343
            width: 52
            height: 52
            bg_opa: TRANSP
            border_width: 1
            border_color: 16776949
            border_opa: 30%
            outline_width: 0
            pad_all: 0
            shadow_width: 0
            radius: 30
            text_font: ui_font_title
            text_color: 16776949
            pressed:
              bg_opa: TRANSP
              shadow_width: 0
            widgets:
            - label:
                id: climate_minus_symbol
                align: CENTER
                text: −
                text_font: ui_font_title
                text_color: 16776949
                clickable: false
        - button:
            id: climate_plus
            x: 99
            y: 343
            width: 52
            height: 52
            bg_opa: TRANSP
            border_width: 1
            border_color: 16776949
            border_opa: 30%
            outline_width: 0
            pad_all: 0
            shadow_width: 0
            radius: 30
            text_font: ui_font_title
            text_color: 16776949
            pressed:
              bg_opa: TRANSP
              shadow_width: 0
            widgets:
            - label:
                id: climate_plus_symbol
                align: CENTER
                text: +
                text_font: ui_font_title
                text_color: 16776949
                clickable: false
        - arc:
            id: climate_arc
            x: 342
            y: 102
            width: 276
            height: 276
            min_value: 160
            max_value: 280
            value: 240
            start_angle: 90
            end_angle: 270
            # Top (16°) to bottom (28°) through the visible left semicircle.
            mode: REVERSE
            adjustable: true
            arc_width: 8
            arc_color: 16776949
            arc_opa: 15%
            arc_rounded: true
            bg_opa: TRANSP
            border_width: 0
            # LVGL draws the 8px stroke inward: -4 keeps its centerline R=138
            # while the circle center stays exactly (480,240).
            pad_all: -4
            indicator:
              arc_color: 15781005
              arc_width: 8
              arc_rounded: true
              pad_all: 0
            knob:
              bg_color: 15781005
              border_color: 16774613
              border_width: 2
              pad_all: 8
              radius: 12
              shadow_color: 15781005
              shadow_width: 16
              shadow_opa: 35%
    - obj:
        id: climate_manual_group
        x: 0
        y: 0
        width: 480
        height: 418
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        scrollable: false
        radius: 0
        hidden: true
        widgets:
        - button:
            id: climate_heat
            x: 48
            y: 155
            width: 160
            height: 174
