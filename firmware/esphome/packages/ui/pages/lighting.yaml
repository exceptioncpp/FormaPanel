lvgl:
  pages:
  - id: ui_lighting
    bg_color: 1054746
    bg_opa: COVER
    text_color: 16776949
    text_font: ui_font_body
    pad_all: 0
    scrollable: false
    widgets:
    - image:
        id: lighting_background
        x: 0
        y: 0
        width: 480
        height: 480
        src: rh01_background
        clickable: false
    - obj:
        id: lighting_dim
        x: 0
        y: 0
        width: 480
        height: 480
        bg_opa: 50%
        border_width: 0
        pad_all: 0
        scrollable: false
        radius: 0
        bg_color: 1054746
        clickable: false
    - button:
        id: lighting_toggle
        x: 41
        y: 102
        width: 157
        height: 199
        bg_opa: TRANSP
        border_width: 0
        border_color: 16776949
        border_opa: 30%
        outline_width: 0
        pad_all: 0
        shadow_width: 0
        radius: 0
        text_font: ui_font_caption
        text_color: 16776949
        pressed:
          bg_opa: TRANSP
          shadow_width: 0
        widgets:
        - image:
            id: lighting_lamp_image
            x: 29
            y: 32
            width: 96
            height: 112
            src: rh01_lamp_off
            clickable: false
            scale: 1.65
    - label:
        id: lighting_primary_caption
        x: 226
        y: 136
        width: 230
        height: 30
        text: Основной свет
        text_font: ui_font_body
        text_color: 16776949
    - label:
        id: lighting_level
        x: 226
        y: 180
        width: 230
        height: 60
        text: --%
        text_font: ui_font_value42
        text_color: 16776949
    - label:
        id: lighting_status
        x: 226
        y: 248
        width: 230
        height: 25
        text: Ожидание HA
        text_font: ui_font_caption
        text_color: 15781005
    - label:
        id: lighting_brightness_caption
        x: 33
        y: 303
        width: 200
        height: 25
        text: Яркость
        text_font: ui_font_caption
        text_color: 16776949
    - label:
        id: lighting_detail
        x: 33
        y: 366
        width: 414
        height: 38
        text: ''
        text_font: ui_font_small
        text_color: 12701642
    - slider:
        id: lighting_brightness
        x: 33
        y: 347
        width: 414
        height: 6
        min_value: 0
        max_value: 100
        value: 0
        bg_color: 16776949
        bg_opa: 17%
        radius: 6
        indicator:
          bg_color: 15781005
          radius: 6
        knob:
          bg_color: 16773578
          pad_all: 7
          radius: 20
          shadow_color: 15781005
          shadow_width: 14
          shadow_opa: 30%
    - label:
        id: lighting_title
        x: 30
        y: 24
        width: 390
        height: 36
        text: Освещение
        text_font: ui_font_title
        text_color: 16776949
    - label:
        id: lighting_room
        x: 30
        y: 65
        width: 330
        height: 22
        text: ${room_label}
        text_font: ui_font_caption
        text_color: 12701642
    - obj:
        id: lighting_nav_rule
        x: 28
        y: 418
        width: 424
        height: 1
        bg_opa: 15%
        border_width: 0
        pad_all: 0
        scrollable: false
        radius: 0
        bg_color: 16776949
        clickable: false
    - button:
        id: lighting_back
        x: 28
        y: 424
        width: 125
        height: 50
        bg_opa: TRANSP
        border_width: 0
        border_color: 16776949
        border_opa: 30%
        outline_width: 0
        pad_all: 0
        shadow_width: 0
        radius: 0
        text_font: ui_font_caption
        text_color: 16776949
        pressed:
          bg_opa: TRANSP
          shadow_width: 0
        widgets:
        - image:
            id: lighting_back_image
            x: 0
            y: 14
            width: 21
            height: 21
            src: ui_icon_back_21
            clickable: false
        - label:
            id: lighting_back_text
            x: 30
            y: 15
            width: 90
            height: 24
            text: Назад
            text_font: ui_font_caption
            text_color: 16776949
    - label:
        id: lighting_nav_room
        x: 164
        y: 442
        width: 150
        height: 20
        text: ${room_label}
        text_font: ui_font_small
        text_color: 11321016
        text_align: CENTER
    - button:
        id: lighting_home
        x: 327
        y: 424
        width: 125
        height: 50
        bg_opa: TRANSP
        border_width: 0
        border_color: 16776949
        border_opa: 30%
        outline_width: 0
        pad_all: 0
        shadow_width: 0
        radius: 0
        text_font: ui_font_caption
        text_color: 16776949
        pressed:
          bg_opa: TRANSP
          shadow_width: 0
        widgets:
        - label:
            id: lighting_home_text
            x: 4
            y: 15
            width: 90
            height: 24
            text: Домой
            text_font: ui_font_caption
            text_color: 16776949
        - image:
            id: lighting_home_image
            x: 102
            y: 14
            width: 21
            height: 21
            src: ui_icon_home_21
            clickable: false
    - button:
        id: lighting_settings
        x: 408
        y: 24
        width: 44
        height: 44
        bg_opa: TRANSP
        border_width: 0
        border_color: 16776949
        border_opa: 30%
        outline_width: 0
        pad_all: 0
        shadow_width: 0
        radius: 0
        text_font: ui_font_caption
        text_color: 16776949
        pressed:
          bg_opa: TRANSP
          shadow_width: 0
        widgets:
        - image:
            id: lighting_gear_image
            x: 6
            y: 6
            width: 32
            height: 32
            src: ui_icon_gear
            clickable: false
