lvgl:
  pages:
  - id: ui_turbo
    bg_color: 1054746
    bg_opa: COVER
    text_color: 16776949
    text_font: ui_font_body
    pad_all: 0
    scrollable: false
    widgets:
    - image:
        id: turbo_background
        x: 0
        y: 0
        width: 480
        height: 480
        src: rh01_background
        clickable: false
    - obj:
        id: turbo_dim
        x: 0
        y: 0
        width: 480
        height: 480
        bg_opa: 50%
        border_width: 0
        pad_all: 0
        scrollable: false
        radius: 0
        bg_color: 1054746
        clickable: false
    - label:
        id: turbo_badge
        x: 320
        y: 32
        width: 130
        height: 22
        text: ЗАГЛУШКА
        text_font: ui_font_small
        text_color: 12903647
        text_align: RIGHT
    - label:
        id: turbo_notice
        x: 28
        y: 91
        width: 424
        height: 25
        text: Устройства не меняют состояние
        text_font: ui_font_small
        text_color: 12701642
        text_align: CENTER
    - image:
        id: turbo_wind_image
        x: 179
        y: 111
        width: 120
        height: 86
        src: ui_icon_wind
        clickable: false
    - label:
        id: turbo_remaining
        x: 0
        y: 210
        width: 480
        height: 78
        text: 00:00
        text_font: ui_font_value64
        text_color: 16776949
        text_align: CENTER
    - label:
        id: turbo_status
        x: 0
        y: 288
        width: 480
        height: 26
        text: Таймер остановлен
        text_font: ui_font_caption
        text_color: 12701642
        text_align: CENTER
    - button:
        id: turbo_stop
        hidden: true
        x: 160
        y: 329
        width: 160
        height: 57
        bg_opa: TRANSP
        border_width: 1
        border_color: 16776949
        border_opa: 30%
        outline_width: 0
        pad_all: 0
        shadow_width: 0
        radius: 30
        text_font: ui_font_body
        text_color: 16776949
        pressed:
          bg_opa: TRANSP
          shadow_width: 0
        widgets:
        - obj:
            id: turbo_stop_mark
            x: 40
            y: 22
            width: 12
            height: 12
            bg_opa: TRANSP
            border_width: 1
            border_color: 16776949
            pad_all: 0
            radius: 2
            clickable: false
            scrollable: false
        - label:
            id: turbo_stop_text
            x: 65
            y: 16
            width: 75
            height: 26
            text: Стоп
            text_font: ui_font_body
            text_color: 16776949
    - button:
        id: turbo_start
        x: 160
        y: 329
        width: 160
        height: 57
        bg_opa: TRANSP
        border_width: 1
        border_color: 16776949
        border_opa: 30%
        outline_width: 0
        pad_all: 0
        shadow_width: 0
        radius: 30
        text_font: ui_font_body
        text_color: 16776949
        pressed:
          bg_opa: TRANSP
          shadow_width: 0
        widgets:
        - label:
            id: turbo_start_text
            align: CENTER
            text: Начать
            text_font: ui_font_body
            text_color: 16776949
            clickable: false
    - label:
        id: turbo_title
        x: 30
        y: 24
        width: 285
        height: 36
        text: Проветривание
        text_font: ui_font_title
        text_color: 16776949
    - label:
        id: turbo_room
        x: 30
        y: 65
        width: 330
        height: 22
        text: ${room_label}
        text_font: ui_font_caption
        text_color: 12701642
    - obj:
        id: turbo_nav_rule
        x: 28
        y: 418
        width: 424
        height: 1
        bg_opa: 15%
        border_width: 0
        pad_all: 0
        scrollable: false
        radius: 0
        bg_color: 16776949
        clickable: false
    - button:
        id: turbo_back
        x: 28
        y: 424
        width: 125
        height: 50
        bg_opa: TRANSP
        border_width: 0
        border_color: 16776949
        border_opa: 30%
        outline_width: 0
        pad_all: 0
        shadow_width: 0
        radius: 0
        text_font: ui_font_caption
        text_color: 16776949
        pressed:
          bg_opa: TRANSP
          shadow_width: 0
        widgets:
        - image:
            id: turbo_back_image
            x: 0
            y: 14
            width: 21
            height: 21
            src: ui_icon_back_21
            clickable: false
        - label:
            id: turbo_back_text
            x: 30
            y: 15
            width: 90
            height: 24
            text: Назад
            text_font: ui_font_caption
            text_color: 16776949
    - label:
        id: turbo_nav_room
        x: 164
        y: 442
        width: 150
        height: 20
        text: ${room_label}
        text_font: ui_font_small
        text_color: 11321016
        text_align: CENTER
    - button:
        id: turbo_home
        x: 327
        y: 424
        width: 125
        height: 50
        bg_opa: TRANSP
        border_width: 0
        border_color: 16776949
        border_opa: 30%
        outline_width: 0
        pad_all: 0
        shadow_width: 0
        radius: 0
        text_font: ui_font_caption
        text_color: 16776949
        pressed:
          bg_opa: TRANSP
          shadow_width: 0
        widgets:
        - label:
            id: turbo_home_text
            x: 4
            y: 15
            width: 90
            height: 24
            text: Домой
            text_font: ui_font_caption
            text_color: 16776949
        - image:
            id: turbo_home_image
            x: 102
            y: 14
            width: 21
            height: 21
            src: ui_icon_home_21
            clickable: false
    - button:
        id: turbo_settings
        x: 408
        y: 24
        width: 44
        height: 44
        hidden: true
