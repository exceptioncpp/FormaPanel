script:
- id: backend_light_toggle
  then:
  - delay: 700ms
  - lambda: auto &s=id(ui_state); s.light_feedback(true,s.light_expected); s.request_feedback(true,s.light_expected);
  - script.execute: ui_render
  mode: single
- id: backend_light_brightness_set
  parameters:
    value: float
    request_id: int
  mode: single
  then:
  - delay: 700ms
  - lambda: id(ui_state).brightness_feedback(value);
  - script.execute: ui_render
- id: backend_mode_set
  then:
  - lambda: id(ui_state).mode=mode; id(ui_state).climate_feedback(0,float(mode));
  - script.execute: ui_render
  parameters:
    mode: int
- id: backend_target_set
  then:
  - lambda: id(ui_state).target=value; id(ui_state).climate_feedback(1,value);
  - script.execute: ui_render
  parameters:
    value: float
- id: backend_manual_set
  then:
  - lambda: if(channel==0) id(ui_state).manual_heat=value; else id(ui_state).manual_cool=value; id(ui_state).climate_feedback(channel==0
      ? 2:3,float(value));
  - script.execute: ui_render
  parameters:
    channel: int
    value: bool
- id: backend_brightness_set
  then: []
  parameters:
    value: float
- id: mock_reset
  then:
  - lambda: 'auto &s=id(ui_state); s=formapanel::State{}; s.mock=true; s.connected=s.helpers_ready=s.contract_ready=true;

      s.mode_known=s.target_known=s.heat_known=s.cool_known=true;

      s.target=24; s.temperature=22.6; s.humidity=45; s.clock="08:00";

      s.outdoor=6; s.wind=7; s.weather_humidity=77; s.pressure=997.3;

      s.condition="Облачно"; s.condition_code="cloudy"; s.weather_source="Яндекс.Погода / MOCK";

      s.brightness_feedback(68); s.panel_brightness=60; s.light_feedback(true,false); s.request_feedback(true,false);

      s.forecast_days[0]={"Завтра","rainy",7,5};

      s.forecast_days[1]={"Вт","cloudy",8,4};

      s.forecast_days[2]={"Ср","sunny",9,3};

      s.forecast_days[3]={"Чт","cloudy",7,2};

      s.forecast_days[4]={"Пт","rainy",6,3};'
  - script.execute: ui_render
esphome:
  on_boot:
  - priority: -100
    then:
    - script.execute: mock_reset
