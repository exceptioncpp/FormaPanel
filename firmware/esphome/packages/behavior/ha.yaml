globals:
- id: ha_last_heartbeat
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: ha_seen_heartbeat
  type: bool
  restore_value: false
  initial_value: 'false'
script:
- id: backend_light_toggle
  then:
  - homeassistant.action:
      action: ${ha_light_toggle}
      data: {}
- id: backend_light_brightness_set
  parameters:
    value: float
    request_id: int
  then:
  - homeassistant.action:
      action: input_number.set_value
      data:
        entity_id: ${ha_light_brightness}
        value: !lambda 'return value;'
      # Action acknowledgement is not state confirmation; only HA echo confirms.
      on_error:
      - lambda: id(ui_state).brightness_error(unsigned(request_id));
      - script.execute: ui_render
- id: backend_mode_set
  then:
  - homeassistant.action:
      action: input_select.select_option
      data:
        entity_id: ${ha_room_mode}
        option: !lambda 'return std::string(mode==0 ? "Auto" : "Manual");'
  parameters:
    mode: int
- id: backend_target_set
  then:
  - homeassistant.action:
      action: input_number.set_value
      data:
        entity_id: ${ha_room_target}
        value: !lambda 'return value;'
  parameters:
    value: float
- id: backend_manual_set
  then:
  - if:
      condition:
        lambda: return value;
      then:
      - homeassistant.action:
          action: input_boolean.turn_on
          data:
            entity_id: !lambda 'return std::string(channel==0 ? "${ha_manual_heat}" : "${ha_manual_cool}");'
      else:
      - homeassistant.action:
          action: input_boolean.turn_off
          data:
            entity_id: !lambda 'return std::string(channel==0 ? "${ha_manual_heat}" : "${ha_manual_cool}");'
  parameters:
    channel: int
    value: bool
- id: backend_brightness_set
  then:
  - light.turn_on:
      id: panel_backlight
      brightness: !lambda 'return value/100.0f;'
  parameters:
    value: float
- id: backend_forecast_update
  parameters:
    slot: int
  then:
  - lambda: |-
      float high=NAN, low=NAN;
      std::string condition, date;
      switch (slot) {
        case 0:
          high=id(ha_weather_day_0_high).state;
          low=id(ha_weather_day_0_low).state;
          condition=id(ha_weather_day_0_condition).state;
          date=id(ha_weather_day_0_date).state;
          break;
        case 1:
          high=id(ha_weather_day_1_high).state;
          low=id(ha_weather_day_1_low).state;
          condition=id(ha_weather_day_1_condition).state;
          date=id(ha_weather_day_1_date).state;
          break;
        case 2:
          high=id(ha_weather_day_2_high).state;
          low=id(ha_weather_day_2_low).state;
          condition=id(ha_weather_day_2_condition).state;
          date=id(ha_weather_day_2_date).state;
          break;
        case 3:
          high=id(ha_weather_day_3_high).state;
          low=id(ha_weather_day_3_low).state;
          condition=id(ha_weather_day_3_condition).state;
          date=id(ha_weather_day_3_date).state;
          break;
        case 4:
          high=id(ha_weather_day_4_high).state;
          low=id(ha_weather_day_4_low).state;
          condition=id(ha_weather_day_4_condition).state;
          date=id(ha_weather_day_4_date).state;
          break;
        default: return;
      }
      auto &day=id(ui_state).forecast_days[slot];
      day.high=high;
      day.low=std::isfinite(high) ? low : NAN;
      day.condition=(std::isfinite(high) && condition!="unknown" && condition!="unavailable" && condition!="None") ? condition : "";
      bool valid_date=date.size()==10 && date[4]=='-' && date[7]=='-';
      day.title=std::isfinite(high) && valid_date ? (slot==0 ? "Завтра" : date.substr(8,2)+"."+date.substr(5,2)) : "--";
  - script.execute: ui_render
sensor:
- platform: homeassistant
  id: ha_heartbeat
  entity_id: sensor.formapanel_living_heartbeat
  internal: true
  on_value:
    then:
    - lambda: if(std::isfinite(x)) { id(ha_last_heartbeat)=millis(); id(ha_seen_heartbeat)=true; id(ui_state).connected=true;
        }
    - script.execute: ui_render
- platform: homeassistant
  id: ha_room_temperature
  entity_id: ${ha_room_temperature}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).temperature=x;
    - script.execute: ui_render
- platform: homeassistant
  id: ha_room_humidity
  entity_id: ${ha_room_humidity}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).humidity=x;
    - script.execute: ui_render
- platform: homeassistant
  id: ha_room_co2
  entity_id: ${ha_room_co2}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).co2=std::isfinite(x) && x>=0 ? x:NAN;
    - script.execute: ui_render
- platform: homeassistant
  id: ha_light_brightness
  entity_id: ${ha_light_brightness}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).brightness_feedback(x);
    - script.execute: ui_render
- platform: homeassistant
  id: ha_weather_temperature
  entity_id: ${ha_weather_temperature}
  internal: true
  on_value:
    then:
