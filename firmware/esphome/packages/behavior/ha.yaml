  entity_id: ${ha_weather_day_4_date}
  internal: true
  on_value:
    then:
    - script.execute:
        id: backend_forecast_update
        slot: 4
time:
- platform: homeassistant
  id: ha_clock
  timezone: Europe/Moscow
  on_time:
  - seconds: '0'
    then:
    - lambda: auto t=id(ha_clock).now(); if(t.is_valid() && id(ui_state).connected) id(ui_state).clock=t.strftime("%H:%M");
    - script.execute: ui_render
interval:
- interval: 1s
  then:
  - lambda: "auto &s=id(ui_state);\nif(!id(ha_seen_heartbeat) || uint32_t(millis()-id(ha_last_heartbeat))>150000)\
      \ {\n if(s.connected) s.disconnect();\n} else { s.connected=true; s.helpers_ready=s.contract_ready && s.mode_known && s.target_known\
      \ && s.heat_known && s.cool_known; }\n"
api:
  on_client_disconnected:
  # ESPHome 2026.10.1 removes the departing client before this trigger.
  # A logger leaving must not invalidate a still-subscribed HA client.
  - if:
      condition:
        not:
          api.connected:
            state_subscription_only: true
      then:
      - lambda: id(ui_state).disconnect(); id(ha_seen_heartbeat)=false;
      - script.execute: ui_render
