    - script.execute: ui_render
- platform: homeassistant
  id: ha_weather_wind
  entity_id: ${ha_weather_wind}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).wind=x;
    - script.execute: ui_render
- platform: homeassistant
  id: ha_weather_humidity
  entity_id: ${ha_weather_humidity}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).weather_humidity=x;
    - script.execute: ui_render
- platform: homeassistant
  id: ha_weather_pressure
  entity_id: ${ha_weather_pressure}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).pressure=x;
    - script.execute: ui_render
- platform: homeassistant
  id: ha_target
  entity_id: ${ha_room_target}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).target=x; id(ui_state).target_known=std::isfinite(x); id(ui_state).climate_feedback(1,x);
    - script.execute: ui_render
- platform: homeassistant
  id: ha_forecast_high
  entity_id: ${ha_weather_tomorrow_high}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).tomorrow_high=x; id(ui_state).update_forecast();
    - script.execute: ui_render
- platform: homeassistant
  id: ha_forecast_low
  entity_id: ${ha_weather_tomorrow_low}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).tomorrow_low=x; id(ui_state).update_forecast();
    - script.execute: ui_render
- platform: homeassistant
  id: ha_weather_day_0_high
  entity_id: ${ha_weather_day_0}
  internal: true
  on_value:
    then:
    - script.execute:
        id: backend_forecast_update
        slot: 0
- platform: homeassistant
  id: ha_weather_day_0_low
  entity_id: ${ha_weather_day_0_low}
  internal: true
  on_value:
    then:
    - script.execute:
        id: backend_forecast_update
        slot: 0
- platform: homeassistant
  id: ha_weather_day_1_high
  entity_id: ${ha_weather_day_1}
  internal: true
  on_value:
    then:
    - script.execute:
        id: backend_forecast_update
        slot: 1
- platform: homeassistant
  id: ha_weather_day_1_low
  entity_id: ${ha_weather_day_1_low}
  internal: true
  on_value:
    then:
    - script.execute:
        id: backend_forecast_update
        slot: 1
- platform: homeassistant
  id: ha_weather_day_2_high
  entity_id: ${ha_weather_day_2}
  internal: true
  on_value:
    then:
    - script.execute:
        id: backend_forecast_update
        slot: 2
- platform: homeassistant
  id: ha_weather_day_2_low
  entity_id: ${ha_weather_day_2_low}
  internal: true
  on_value:
    then:
    - script.execute:
        id: backend_forecast_update
        slot: 2
- platform: homeassistant
  id: ha_weather_day_3_high
  entity_id: ${ha_weather_day_3}
  internal: true
  on_value:
    then:
    - script.execute:
        id: backend_forecast_update
        slot: 3
- platform: homeassistant
  id: ha_weather_day_3_low
  entity_id: ${ha_weather_day_3_low}
  internal: true
  on_value:
    then:
    - script.execute:
        id: backend_forecast_update
        slot: 3
- platform: homeassistant
  id: ha_weather_day_4_high
  entity_id: ${ha_weather_day_4}
  internal: true
  on_value:
    then:
    - script.execute:
        id: backend_forecast_update
        slot: 4
- platform: homeassistant
  id: ha_weather_day_4_low
  entity_id: ${ha_weather_day_4_low}
  internal: true
  on_value:
    then:
    - script.execute:
        id: backend_forecast_update
        slot: 4
text_sensor:
- platform: homeassistant
  id: ha_contract_ready
  entity_id: ${ha_contract_ready}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).contract_ready=(x=="on");
    - script.execute: ui_render
- platform: homeassistant
  id: ha_backend_status
  entity_id: ${ha_backend_status}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).backend_status=x;
    - script.execute: ui_render
- platform: homeassistant
  id: ha_mode
  entity_id: ${ha_room_mode}
  internal: true
  on_value:
    then:
    - lambda: 'id(ui_state).mode_known=(x=="Auto" || x=="Manual"); id(ui_state).mode=(x=="Manual" ? 1 : 0); if(id(ui_state).mode_known)
        id(ui_state).climate_feedback(0,float(id(ui_state).mode));'
    - script.execute: ui_render
- platform: homeassistant
  id: ha_heat
  entity_id: ${ha_manual_heat}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).heat_known=(x=="on" || x=="off"); id(ui_state).manual_heat=(x=="on"); if(id(ui_state).heat_known)
        id(ui_state).climate_feedback(2,float(id(ui_state).manual_heat));
    - script.execute: ui_render
- platform: homeassistant
  id: ha_cool
  entity_id: ${ha_manual_cool}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).cool_known=(x=="on" || x=="off"); id(ui_state).manual_cool=(x=="on"); if(id(ui_state).cool_known)
        id(ui_state).climate_feedback(3,float(id(ui_state).manual_cool));
    - script.execute: ui_render
- platform: homeassistant
  id: ha_light_state
  entity_id: ${ha_light_actual}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).light_feedback(x=="on" || x=="off",x=="on");
    - script.execute: ui_render
- platform: homeassistant
  id: ha_weather_condition
  entity_id: ${ha_weather_condition}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).condition_code=x; id(ui_state).condition=formapanel::State::condition_name(x);
    - script.execute: ui_render
- platform: homeassistant
  id: ha_weather_source
  entity_id: ${ha_weather_source}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).weather_source=formapanel::State::source_name(x);
    - script.execute: ui_render
- platform: homeassistant
  id: ha_weather_tomorrow
  entity_id: ${ha_weather_tomorrow}
  internal: true
  on_value:
    then:
    - lambda: if(x!="available") { id(ui_state).tomorrow_high=NAN; id(ui_state).tomorrow_low=NAN; id(ui_state).tomorrow_condition.clear(); } id(ui_state).update_forecast();
    - script.execute: ui_render
- platform: homeassistant
  id: ha_light_requested
  entity_id: input_boolean.formapanel_living_primary_light_requested
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).request_feedback(x=="on" || x=="off",x=="on");
    - script.execute: ui_render
- platform: homeassistant
  id: ha_forecast_source
  entity_id: ${ha_weather_forecast_source}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).forecast_source=formapanel::State::source_name(x); id(ui_state).update_forecast();
    - script.execute: ui_render
- platform: homeassistant
  id: ha_forecast_condition
  entity_id: ${ha_weather_tomorrow_condition}
  internal: true
  on_value:
    then:
    - lambda: id(ui_state).tomorrow_condition=x; id(ui_state).update_forecast();
    - script.execute: ui_render
- platform: homeassistant
  id: ha_weather_day_0_condition
  entity_id: ${ha_weather_day_0_condition}
  internal: true
  on_value:
    then:
    - script.execute:
        id: backend_forecast_update
        slot: 0
- platform: homeassistant
  id: ha_weather_day_0_date
  entity_id: ${ha_weather_day_0_date}
  internal: true
