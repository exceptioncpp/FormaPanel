debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: "Free Internal Heap"
    block:
      name: "Largest Heap Block"
    psram:
      name: "Free PSRAM"
    loop_time:
      name: "Loop Time"
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
  - platform: version
    name: "ESPHome Version"

binary_sensor:
  - platform: status
    name: "Status"
